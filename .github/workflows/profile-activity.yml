name: Refresh public profile activity

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_activity.py'
      - 'scripts/test_activity.py'
      - '.github/workflows/profile-activity.yml'

permissions:
  contents: write

concurrency:
  group: public-profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Validate generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh graphics from public data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Publish changed graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/activity-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public profile activity'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
